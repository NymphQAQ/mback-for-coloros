name: Build and publish APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "app/**"
      - "stubs/**"
      - "build-local.sh"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;36.0.0"
      - name: Create debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build signed APK
        run: bash build-local.sh
      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify app/build/local/mback-debug.apk"
      - name: Publish v0.6.4 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.4
          name: MBack for ColorOS v0.6.4
          prerelease: true
          generate_release_notes: true
          files: app/build/local/mback-debug.apk
          fail_on_unmatched_files: true
          body: |
            Experimental Xposed module for OnePlus 15 / ColorOS (Android 17).
            Scopes: com.android.systemui AND com.android.launcher. Requires Vector Framework or compatible LSPosed.
            New: Flyme-inspired circular fan UI replaces the previous bottom sheet.
            Filter native ColorOS back and Quickstep gesture prefixes in two
            bottom corners, without changing central navigation gestures.
            Invisible bottom-corner touch shields prevent tap-through.
            Swipe and release on an app, or tap a shortcut to open a native
            ColorOS floating window. Up to 6 selectable apps; portrait only.
            The corner feature remains off by default on a fresh install.
            Retains mBack tap-to-back, visual-center scaling and haptic feedback.
            This is not a pixel-perfect recreation of Flyme. Debug-signed APK.
