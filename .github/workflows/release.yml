name: Build MBack and publish prepared releases

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "app/**"
      - "stubs/**"
      - "build-local.sh"
      - "releases/**"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the prepared signed APK
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_TAG: v0.7.0
  RELEASE_APK: releases/mback-v0.7.0.apk

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android build tools
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platforms;android-35" "build-tools;36.0.0"
      - name: Create temporary build-only signing key
        run: |
          mkdir -p "${HOME}/.android"
          keytool -genkeypair -v -keystore "${HOME}/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Compile source
        run: bash build-local.sh
      - name: Verify prepared release APK
        if: contains(github.event.head_commit.message, '[release]') || inputs.publish
        run: |
          (
            cd releases
            sha256sum --check "$(basename "${RELEASE_APK}").sha256"
          )
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify "${RELEASE_APK}"
          badging="$("${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "${RELEASE_APK}")"
          [[ "${badging}" == *"versionName='${RELEASE_TAG#v}'"* ]]

  publish:
    needs: verify
    if: contains(github.event.head_commit.message, '[release]') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
      - name: Publish signed APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (
            cd releases
            sha256sum --check "$(basename "${RELEASE_APK}").sha256"
          )
          gh release create "${RELEASE_TAG}" "${RELEASE_APK}" "${RELEASE_APK}.sha256" \
            --target "${GITHUB_SHA}" --title "MBack for ColorOS ${RELEASE_TAG}" \
            --notes-file .github/release-notes.md --prerelease
