name: Verify MBack source (no APK publishing)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "app/**"
      - "stubs/**"
      - "build-local.sh"
      - "tests/**"
  workflow_dispatch:

# Read-only CI. Deliberately no GitHub Release, tag, artifact upload,
# package publishing, or repository write permissions until requested.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;36.0.0"
      - name: Create temporary CI-only signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Compile source and check APK locally
        run: |
          bash build-local.sh
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/local/mback-debug.apk
      - name: Run pure Java regression tests
        run: |
          mkdir -p app/build/local/tests
          javac -d app/build/local/tests \
            app/src/main/java/dev/mback/oneplus/CornerGesture.java \
            tests/dev/mback/oneplus/CornerGestureTest.java \
            app/src/main/java/dev/mback/oneplus/FlymeArcGeometry.java \
            tests/dev/mback/oneplus/FlymeArcGeometryTest.java \
            app/src/main/java/dev/mback/oneplus/HitZone.java \
            tests/dev/mback/oneplus/HitZoneTest.java \
            app/src/main/java/dev/mback/oneplus/FeedbackConfig.java \
            tests/dev/mback/oneplus/FeedbackConfigTest.java \
            app/src/main/java/dev/mback/oneplus/PillGeometry.java \
            tests/dev/mback/oneplus/PillGeometryTest.java
          for test in CornerGestureTest FlymeArcGeometryTest HitZoneTest FeedbackConfigTest PillGeometryTest; do
            java -cp app/build/local/tests "dev.mback.oneplus.$test"
          done
